# WeSleep - Docker Compose Configuration
# Orchestrates the API service and persists data via volumes.

services:
  api:
    build: .
    container_name: wesleep-api
    # Map host port 8000 to container port 8000
    ports:
      - "8000:8000"
    # Hot-reload code
    volumes:
      - .:/app
    environment:
      - PROJECT_NAME=WeSleep
      - API_V1_STR=/api/v1
      # PostgreSQL async connection string (Supabase compatible)
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes: {}
