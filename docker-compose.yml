# WeSleep - Docker Compose Configuration
# Orchestrates the API service and persists data via volumes.

services:
  db:
    image: postgres:17
    container_name: wesleep-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=wesleep
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wesleep"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: wesleep-api
    # Map host port 8000 to container port 8000
    ports:
      - "8000:8000"
    # Hot-reload code
    volumes:
      - .:/app
    environment:
      - PROJECT_NAME=WeSleep
      - API_V1_STR=/api/v1
      # PostgreSQL async connection string (local by default)
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/wesleep
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: wesleep-frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=100
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  db-data: {}
  frontend-node-modules: {}
